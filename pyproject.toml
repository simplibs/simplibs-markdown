[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "simplibs-markdown"
version = "0.1.0"
description = "Markdown built from nodes: a tree of named, validated Python objects that writes escaped, well-formed Markdown — headings, lists, tables, code, links, alerts and more — with structured errors instead of malformed text."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "markdown",
    "md",
    "markdown-generator",
    "markdown-builder",
    "document",
    "documentation",
    "github-flavored-markdown",
    "gfm",
    "table",
    "escape",
    "text",
    "simplibs",
    "simplibs-markdown",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "simplibs-exception>=1.1.4",
    "simplibs-file>=0.1.0",
]

[[project.authors]]
name = "Dalibor Sova (Sudip2708)"
email = "daliborsova@seznam.cz"

[project.urls]
Homepage = "https://github.com/simplibs/simplibs-markdown"
Repository = "https://github.com/simplibs/simplibs-markdown"
Issues = "https://github.com/simplibs/simplibs-markdown/issues"
Changelog = "https://github.com/simplibs/simplibs-markdown/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=9.1",          # the `subtests` fixture is built in since pytest 9
    "pytest-cov>=5.0",
    "markdown-it-py>=3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v -rs"

[tool.coverage.run]
branch = true
source = ["simplibs.markdown"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.setuptools.packages.find]
where = ["src"]
